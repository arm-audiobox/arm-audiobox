<text x="42" y="188" fill="#edf1ed" font-size="44" font-weight="620">A touch closer to your music.</text>
<text x="42" y="224" fill="#a3b0a5" font-size="17">ESP32 touch remote for Squeezelite and Lyrion Music Server.</text>
