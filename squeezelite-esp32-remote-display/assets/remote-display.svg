<g transform="translate(340 266)"><rect width="280" height="142" rx="17" fill="#1b231d" stroke="#4d6543"/><text x="20" y="39" fill="#edf1ed" font-size="23">Now playing</text><text x="20" y="72" fill="#a3b0a5" font-size="13">Track details and cover artwork.</text><path d="M20 93h240" stroke="#303a31"/><text x="20" y="119" fill="#bcf392" font-size="11">LIBRARY · RADIO · QUEUE</text></g>
