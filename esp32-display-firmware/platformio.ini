[platformio]
default_envs = waveshare_c6_147

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+
lib_deps = bodmer/TJpg_Decoder@1.1.0

[env:st7789]
build_flags = -D PLAYER_DISPLAY_ST7789

[env:waveshare_c6_147]
extra_scripts = pre:build-support.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -D PLAYER_DISPLAY_ST7789
  -D PLAYER_DISPLAY_WAVESHARE_C6_147
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D jd_prepare=player_tjpgd_prepare
  -D jd_decomp=player_tjpgd_decomp
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7-libs.tar.xz
