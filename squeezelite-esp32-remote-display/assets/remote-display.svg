<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">arm-audiobox · ESP32 remote display</title>
<desc id="desc">LMS touch remote in the dark green PogoPlayer style, with player controls, cover artwork and a standby clock.</desc>
