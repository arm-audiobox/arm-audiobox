[platformio]
default_envs = cyd-st7789
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/build_translations.py
lib_deps =
  lovyan03/LovyanGFX @ 1.2.28
  bblanchon/ArduinoJson @ 7.4.3
[env:cyd-ili9341]
build_flags = -DCYD_ILI9341=1
[env:cyd-st7789]
build_flags = -DCYD_ST7789=1
